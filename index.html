<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificacions - Lliga Catalana 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-red-900 min-h-screen p-4 md:p-8 flex justify-center">

  <div class="w-full max-w-xl space-y-4">
    
    <!-- Capçalera -->
    <div class="bg-blue-900 text-white rounded-2xl p-5 shadow-lg flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black tracking-wide">Classificacions</h1>
        <p class="text-blue-200 text-sm">Lliga Catalana 2026</p>
      </div>
      <div id="updated-at" class="bg-red-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow">
        Modificat: --/--/---- --:--
      </div>
    </div>

    <!-- Secció Generals -->
    <div class="border-2 border-white/20 rounded-2xl overflow-hidden bg-emerald-700 shadow-md">
      <button onclick="toggleSection('generals')" class="w-full p-4 text-left text-white font-bold text-lg flex justify-between items-center">
        <span>GENERALS</span>
        <i id="icon-generals" class="fa-solid fa-play text-sm transition-transform duration-200"></i>
      </button>
      <div id="content-generals" class="hidden bg-white p-3 space-y-2"></div>
    </div>

    <!-- Secció Campionat Cat -->
    <div class="border-2 border-white/20 rounded-2xl overflow-hidden bg-amber-600 shadow-md">
      <button onclick="toggleSection('campionat')" class="w-full p-4 text-left text-white font-bold text-lg flex justify-between items-center">
        <span>CAMPIONAT CAT</span>
        <i id="icon-campionat" class="fa-solid fa-play text-sm transition-transform duration-200"></i>
      </button>
      <div id="content-campionat" class="hidden bg-white p-3 space-y-2"></div>
    </div>

    <!-- Contenidor dinàmic per les TASKS -->
    <div id="tasks-container" class="space-y-4"></div>

  </div>

  <script>
    function toggleSection(id) {
      const el = document.getElementById(`content-${id}`);
      const icon = document.getElementById(`icon-${id}`);
      el.classList.toggle('hidden');
      if (icon) {
        icon.classList.toggle('rotate-90');
      }
    }

    fetch('manifest.json')
      .then(res => res.json())
      .then(data => {
        // 1. Mostrar data d'actualització global
        if (data.updated_at) {
          document.getElementById('updated-at').textContent = `Modificat: ${data.updated_at}`;
        }

        // 2. Renderitzar Generals
        const genDiv = document.getElementById('content-generals');
        data.generals.forEach(item => {
          genDiv.innerHTML += `
            <a href="${item.path}" class="flex justify-between items-center p-3 bg-red-200 hover:bg-red-300 rounded-xl font-bold text-blue-950 transition">
              <span>${item.name}</span>
              <i class="fa-solid fa-arrow-right text-sm"></i>
            </a>`;
        });

        // 3. Renderitzar Campionat
        const campDiv = document.getElementById('content-campionat');
        data.campionat.forEach(item => {
          campDiv.innerHTML += `
            <a href="${item.path}" class="flex justify-between items-center p-3 bg-red-200 hover:bg-red-300 rounded-xl font-bold text-blue-950 transition">
              <span>${item.name}</span>
              <i class="fa-solid fa-arrow-right text-sm"></i>
            </a>`;
        });

        // 4. Renderitzar Tasks amb data
        const tasksContainer = document.getElementById('tasks-container');
        tasksContainer.innerHTML = '';

        Object.keys(data.tasks).sort().forEach(taskKey => {
          const taskData = data.tasks[taskKey];
          const items = Array.isArray(taskData) ? taskData : taskData.items;
          const taskDate = (!Array.isArray(taskData) && taskData.date) ? ` - ${taskData.date}` : '';

          const taskBlock = document.createElement('div');
          taskBlock.className = 'border-2 border-white/20 rounded-2xl overflow-hidden bg-blue-900 shadow-md';
          
          let linksHTML = items.map(item => {
            const isBlue = item.name.startsWith('B_');
            const bgClass = isBlue ? 'bg-blue-200 hover:bg-blue-300' : 'bg-red-200 hover:bg-red-300';
            return `
              <a href="${item.path}" class="flex justify-between items-center p-3 ${bgClass} rounded-xl font-bold text-blue-950 transition mb-2 last:mb-0">
                <span>${item.name}</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
              </a>`;
          }).join('');

          taskBlock.innerHTML = `
            <button onclick="toggleSection('${taskKey}')" class="w-full p-4 text-left text-white font-bold text-lg flex justify-between items-center">
              <span>${taskKey}${taskDate}</span>
              <i id="icon-${taskKey}" class="fa-solid fa-play text-sm transition-transform duration-200"></i>
            </button>
            <div id="content-${taskKey}" class="hidden bg-white p-3 space-y-2">
              ${linksHTML}
            </div>
          `;

          tasksContainer.appendChild(taskBlock);
        });
      })
      .catch(err => console.error("Error carregant el manifest:", err));
  </script>
</body>
</html>
