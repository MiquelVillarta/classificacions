<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificacions - Lliga Catalana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-red-900 min-h-screen p-4 md:p-8 flex justify-center">

  <div class="w-full max-w-xl space-y-4">

    <!-- Capçalera -->
    <div class="bg-blue-900 text-white rounded-2xl p-5 shadow-lg space-y-3">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-black tracking-wide">Classificacions</h1>
          <p class="text-blue-200 text-sm">Lliga Catalana</p>
        </div>
        <div id="updated-at" class="bg-red-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow">
          Modificat: --/--/---- --:--
        </div>
      </div>

      <!-- Selector de temporada -->
      <div class="flex items-center gap-2">
        <label for="year-select" class="text-blue-200 text-sm font-bold">Temporada:</label>
        <select id="year-select" class="flex-1 rounded-lg px-3 py-1.5 text-blue-950 font-bold bg-white"></select>
      </div>
    </div>

    <!-- Secció Generals -->
    <div class="border-2 border-white/20 rounded-2xl overflow-hidden bg-emerald-700 shadow-md">
      <button onclick="toggleSection('generals')" class="w-full p-4 text-left text-white font-bold text-lg flex justify-between items-center">
        <span>GENERALS</span>
        <i id="icon-generals" class="fa-solid fa-play text-sm transition-transform duration-200"></i>
      </button>
      <div id="content-generals" class="hidden bg-white p-3 space-y-2"></div>
    </div>

    <!-- Secció Campionat Cat -->
    <div class="border-2 border-white/20 rounded-2xl overflow-hidden bg-amber-600 shadow-md">
      <button onclick="toggleSection('campionat')" class="w-full p-4 text-left text-white font-bold text-lg flex justify-between items-center">
        <span>CAMPIONAT CAT</span>
        <i id="icon-campionat" class="fa-solid fa-play text-sm transition-transform duration-200"></i>
      </button>
      <div id="content-campionat" class="hidden bg-white p-3 space-y-2"></div>
    </div>

    <!-- Contenidor dinàmic per les TASKS -->
    <div id="tasks-container" class="space-y-4"></div>

  </div>

  <script>
    let manifestData = null;

    function toggleSection(id) {
      const el = document.getElementById(`content-${id}`);
      const icon = document.getElementById(`icon-${id}`);
      el.classList.toggle('hidden');
      if (icon) {
        icon.classList.toggle('rotate-90');
      }
    }

    function getCategoryClass(name) {
      const u = name.toUpperCase();

      // Lliga B sempre en blau
      const isB = u.startsWith('B_') || u.includes('LLIGA-B') || u.includes('LLIGA_B') || u.includes('LLIGA B') || u.includes('CAMPIONAT B');
      if (isB) return 'bg-blue-200 hover:bg-blue-300';

      // FEMINES diferenciat en lila
      if (u.includes('FEMINES') || u.includes('FEMENINA')) return 'bg-purple-300 hover:bg-purple-400';

      // SERIAL, SPORT i CLUB en ambre
      if (u.includes('SERIAL') || u.includes('SPORT') || u.includes('CLUB')) return 'bg-amber-300 hover:bg-amber-400';

      // GENERAL i la resta, vermellós per defecte
      return 'bg-red-200 hover:bg-red-300';
    }

    function renderLink(item) {
      const bgClass = getCategoryClass(item.name);
      return `
        <a href="${item.path}" class="flex justify-between items-center p-3 ${bgClass} rounded-xl font-bold text-blue-950 transition mb-2 last:mb-0">
          <span>${item.name}</span>
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </a>`;
    }

    function renderYear(year) {
      const yearData = manifestData.years[year];
      if (!yearData) return;

      // Generals
      const genDiv = document.getElementById('content-generals');
      genDiv.innerHTML = '';
      yearData.generals.forEach(item => { genDiv.innerHTML += renderLink(item); });

      // Campionat
      const campDiv = document.getElementById('content-campionat');
      campDiv.innerHTML = '';
      yearData.campionat.forEach(item => { campDiv.innerHTML += renderLink(item); });

      // Tasks
      const tasksContainer = document.getElementById('tasks-container');
      tasksContainer.innerHTML = '';

      Object.keys(yearData.tasks).sort().forEach(taskKey => {
        const taskData = yearData.tasks[taskKey];
        const items = Array.isArray(taskData) ? taskData : taskData.items;
        const taskDate = (!Array.isArray(taskData) && taskData.date) ? ` - ${taskData.date}` : '';

        const taskBlock = document.createElement('div');
        taskBlock.className = 'border-2 border-white/20 rounded-2xl overflow-hidden bg-blue-900 shadow-md';

        let linksHTML = items.map(item => renderLink(item)).join('');

        // Número de mànega per al visor (ex: "T07" -> "7")
        const mangaNum = taskKey.replace(/\D/g, '').replace(/^0+/, '');
        const mapUrl = `visor.html?season=${encodeURIComponent(year)}&manga=${encodeURIComponent(mangaNum)}`;

        taskBlock.innerHTML = `
          <div class="w-full p-4 flex justify-between items-center gap-2">
            <button onclick="toggleSection('${taskKey}')" class="flex-1 text-left text-white font-bold text-lg flex justify-between items-center">
              <span>${taskKey}${taskDate}</span>
              <i id="icon-${taskKey}" class="fa-solid fa-play text-sm transition-transform duration-200 ml-2"></i>
            </button>
            <a href="${mapUrl}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2.5 py-1.5 rounded flex items-center gap-1 flex-shrink-0">
              <span>🗺️ Visor</span>
            </a>
          </div>
          <div id="content-${taskKey}" class="hidden bg-white p-3 space-y-2">
            ${linksHTML}
          </div>
        `;

        tasksContainer.appendChild(taskBlock);
      });
    }

    fetch('manifest.json')
      .then(res => res.json())
      .then(data => {
        manifestData = data;

        if (data.updated_at) {
          document.getElementById('updated-at').textContent = `Modificat: ${data.updated_at}`;
        }

        // Omplir el desplegable d'anys (més recent primer)
        const yearSelect = document.getElementById('year-select');
        const years = Object.keys(data.years).sort((a, b) => b.localeCompare(a));
        yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');

        const defaultYear = data.latest_year && years.includes(data.latest_year) ? data.latest_year : years[0];
        yearSelect.value = defaultYear;

        yearSelect.addEventListener('change', () => renderYear(yearSelect.value));

        renderYear(defaultYear);
      })
      .catch(err => console.error("Error carregant el manifest:", err));
  </script>
</body>
</html>
