<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificacions Parapent</title>
  <!-- Favicon de la web -->
  <link rel="icon" type="image/png" href="trofeo.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

  <!-- VISTA 1: MENÚ PRINCIPAL (Móvil First) -->
  <div id="menu-view" class="flex-1 flex flex-col max-w-lg w-full mx-auto p-4">
    
    <!-- Header principal -->
    <header class="bg-blue-900 text-white p-4 rounded-xl shadow-md mb-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-tight">Classificacions</h1>
        <p class="text-xs text-blue-200">Parapent 2026</p>
      </div>
      <span class="bg-red-600 text-white text-xs font-extrabold px-2.5 py-1 rounded-md shadow">2026</span>
    </header>

    <!-- Listado de Secciones (Generals, Campionat, Tasks) -->
    <main id="sections-container" class="space-y-3 flex-1">
      <!-- Se generan dinámicamente -->
    </main>
  </div>

  <!-- VISTA 2: VISOR A PANTALLA COMPLETA -->
  <div id="viewer-view" class="hidden fixed inset-0 bg-white flex flex-col z-50">
    
    <!-- Barra superior compacta para móvil -->
    <header class="bg-blue-900 text-white px-3 py-2.5 flex items-center justify-between shadow flex-shrink-0">
      <button id="back-btn" class="bg-blue-800 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded flex items-center gap-1">
        <span>⬅️ Tornar</span>
      </button>
      
      <span id="current-title" class="text-xs font-bold truncate max-w-[180px] text-center"></span>
      
      <a id="map-btn" href="#" target="_blank" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2.5 py-1.5 rounded flex items-center gap-1">
        <span>🗺️ Mapa</span>
      </a>
    </header>

    <!-- Contenido HTML de la clasificación (100% de pantalla) -->
    <iframe id="viewer-iframe" class="w-full flex-grow border-none" title="Classificació"></iframe>
  </div>

  <script>
    function getCategoryScore(name) {
      const u = name.toUpperCase().trim();

      if (
        u === 'GENERAL' || 
        u.endsWith('-GENERAL') || 
        u.endsWith(' GENERAL') ||
        (u.includes('OVERALL') && !u.startsWith('B_') && !u.includes('LLIGA'))
      ) {
        if (!u.includes('SERIAL') && !u.includes('SPORT') && !u.includes('CLUB') && !u.includes('FEMINES')) {
          return 1;
        }
      }

      if (u.includes('SERIAL')) return 2;
      if (u.includes('SPORT')) return 3;
      if (u.includes('CLUBS-LLICENCIA') || u.includes('CLUBS_LLICENCIA') || u.includes('CLUBS LLICENCIA')) return 5;
      if (u.includes('CLUB')) return 4;
      if (u.includes('FEMINES') || u.includes('FEMENINA')) return 6;
      if (u.includes('LLIGA B') || u.includes('LLIGA_B') || u.startsWith('B_') || u.includes('B_OVERALL') || u.includes('CAMPIONAT B')) return 7;

      return 99;
    }

    async function init() {
      try {
        const res = await fetch('manifest.json');
        if (!res.ok) throw new Error('manifest.json no trobat');
        const data = await res.json();
        
        const sectionsContainer = document.getElementById('sections-container');
        const menuView = document.getElementById('menu-view');
        const viewerView = document.getElementById('viewer-view');
        const iframe = document.getElementById('viewer-iframe');
        const backBtn = document.getElementById('back-btn');
        const currentTitle = document.getElementById('current-title');
        const mapBtn = document.getElementById('map-btn');

        // Función para abrir la clasificación
        function openClassification(item, isTask = false, taskName = '') {
          iframe.src = item.path;
          currentTitle.textContent = item.name;
          
          if (isTask) {
            mapBtn.classList.remove('hidden');

            // Detectar automáticamente si es Liga A o Liga B
            const uName = item.name.toUpperCase();
            let compParam = 'A'; // Por defecto Liga A

            if (uName.startsWith('B_') || uName.includes('LLIGA_B') || uName.includes('CAMPIONAT B')) {
              compParam = 'B';
            }

            // Extraer solo los números de taskName (ej: "T01" -> "1", "T05" -> "5")
            const mangaNum = taskName.replace(/\D/g, '').replace(/^0+/, '');

            // Construir la URL completa que requiere visor.html
            mapBtn.href = `visor.html?task=${encodeURIComponent(taskName)}&comp=${compParam}&manga=${mangaNum}`;
          } else {
            mapBtn.classList.add('hidden');
          }

          menuView.classList.add('hidden');
          viewerView.classList.remove('hidden');
        }      
        
        // Botón volver
        backBtn.onclick = () => {
          viewerView.classList.add('hidden');
          menuView.classList.remove('hidden');
          iframe.src = 'about:blank';
        };

        // Construir datos
        const sections = [];

        if (data.generals && data.generals.length > 0) {
          sections.push({ label: 'GENERALS', items: data.generals, isTask: false, headerBg: 'bg-emerald-700' });
        }
        if (data.campionat && data.campionat.length > 0) {
          sections.push({ label: 'CAMPIONAT CAT', items: data.campionat, isTask: false, headerBg: 'bg-amber-600' });
        }
        
        if (data.tasks) {
          const sortedTasks = Object.keys(data.tasks).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
          sortedTasks.forEach(taskKey => {
            sections.push({ label: taskKey.toUpperCase(), items: data.tasks[taskKey], isTask: true, taskName: taskKey, headerBg: 'bg-blue-900' });
          });
        }

        // Renderizar acordeones para móvil
        sections.forEach(sec => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden';

          const cardHeader = document.createElement('button');
          cardHeader.className = `w-full text-left px-4 py-3 text-white font-bold text-sm flex justify-between items-center ${sec.headerBg}`;
          
          // Flecha inicial hacia la derecha ▶ (indica que está plegado)
          cardHeader.innerHTML = `<span>${sec.label}</span><span class="text-xs opacity-75 arrow-icon">▶</span>`;

          const cardBody = document.createElement('div');
          // Se añade la clase 'hidden' por defecto para que aparezca plegado
          cardBody.className = 'p-3 grid grid-cols-1 gap-2 bg-gray-50 hidden';

          const sortedItems = [...sec.items].sort((a, b) => {
            const scoreA = getCategoryScore(a.name);
            const scoreB = getCategoryScore(b.name);
            if (scoreA !== scoreB) return scoreA - scoreB;
            return a.name.localeCompare(b.name);
          });

          sortedItems.forEach(item => {
            const btn = document.createElement('button');
            const uName = item.name.toUpperCase();
            
            const isCategoryB = getCategoryScore(item.name) === 7 || 
                                uName.startsWith('B_') || 
                                uName.includes('CAMPIONAT B') || 
                                uName.includes('LLIGA B');

            // ESTILOS DE BOTONES MEJORADOS (Mayor contraste + efecto Hover)
            const btnStyle = isCategoryB 
              ? 'bg-red-50 hover:bg-red-600 text-red-900 hover:text-white border-red-300' 
              : 'bg-blue-50 hover:bg-blue-600 text-blue-950 hover:text-white border-blue-200';

            btn.className = `group w-full text-left px-3 py-2.5 text-xs font-bold uppercase rounded-lg border shadow-sm hover:shadow-md transition-all duration-200 flex justify-between items-center ${btnStyle}`;
            btn.innerHTML = `<span>${item.name}</span> <span class="text-blue-400 group-hover:text-white transition-colors duration-200 text-xs">➔</span>`;

            btn.onclick = () => openClassification(item, sec.isTask, sec.taskName);
            cardBody.appendChild(btn);
          });

          // Plegar/desplegar acordeón y alternar la flecha (▶ / ▼)
          cardHeader.onclick = () => {
            const isHidden = cardBody.classList.toggle('hidden');
            const arrow = cardHeader.querySelector('.arrow-icon');
            if (arrow) {
              arrow.textContent = isHidden ? '▶' : '▼';
            }
          };

          card.appendChild(cardHeader);
          card.appendChild(cardBody);
          sectionsContainer.appendChild(card);
        });
        
      } catch (err) {
        console.error('Error carregant el manifest:', err);
      }
    }

    init();
  </script>
</body>
</html>
