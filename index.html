<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classificacions Lliga de Parapent</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animació suau per desplegar/plegar seccions */
    .accordion-content {
      transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
    }
    .accordion-content.open {
      max-height: 1000px;
      opacity: 1;
    }
    .arrow-icon {
      transition: transform 0.2s ease;
    }
    .arrow-icon.open {
      transform: rotate(90deg);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-3 md:p-6">

  <div class="max-w-3xl mx-auto space-y-4">
    
    <!-- Capçalera amb títol a l'esquerra i última actualització a la dreta -->
    <header class="bg-white rounded-xl shadow-sm p-4 flex justify-between items-center border border-slate-200">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-slate-900">Classificacions</h1>
      </div>
      <div class="text-right">
        <span id="last-updated" class="text-xs font-medium text-slate-500 block"></span>
      </div>
    </header>

    <!-- Contenidor principal on es generaran dinàmicament les seccions -->
    <main id="app" class="space-y-3">
      <div class="p-8 text-center text-slate-500">
        Carregant classificacions...
      </div>
    </main>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Afegim un timestamp per evitar problemes de memòria cau amb manifest.json
      fetch('manifest.json?v=' + new Date().getTime())
        .then(response => {
          if (!response.ok) {
            throw new Error('No s'ha pogut carregar el manifest.json');
          }
          return response.json();
        })
        .then(data => {
          // 1. Mostrar la data d'última actualització a dalt a la dreta
          if (data.updated_at) {
            document.getElementById('last-updated').textContent = `Actualitzat: ${data.updated_at}`;
          }

          const app = document.getElementById('app');
          app.innerHTML = ''; // Netejar missatge de càrrega

          const sections = [];

          // 2. Processar Secció GENERALS
          if (data.generals && data.generals.length > 0) {
            sections.push({
              label: 'GENERALS',
              items: data.generals,
              headerBg: 'bg-slate-800'
            });
          }

          // 3. Processar Secció CAMPIONAT
          if (data.campionat && data.campionat.length > 0) {
            sections.push({
              label: 'CAMPIONAT CATALUNYA',
              items: data.campionat,
              headerBg: 'bg-indigo-900'
            });
          }

          // 4. Processar TASKS (MANGUES)
          if (data.tasks) {
            // Ordenar les tasques de forma natural (T01, T02... T10)
            const sortedTasks = Object.keys(data.tasks).sort((a, b) => 
              a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
            );

            sortedTasks.forEach(taskKey => {
              const taskData = data.tasks[taskKey];
              
              // Suporta l'estructura nova (objecte amb items i date) i l'antiga (array)
              const items = Array.isArray(taskData) ? taskData : (taskData.items || []);
              const taskDate = taskData.date || '';

              sections.push({ 
                label: taskKey.toUpperCase(), 
                date: taskDate,
                items: items, 
                headerBg: 'bg-blue-900' 
              });
            });
          }

          // 5. Renderitzar les seccions a l'HTML
          sections.forEach((sec, idx) => {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200';

            // Data formatada si existeix la propietat sec.date
            const dateHTML = sec.date ? `<span class="text-xs font-normal text-blue-200 ml-1.5">(${sec.date})</span>` : '';

            // Capçalera desplegable (Accordion Header)
            const cardHeader = document.createElement('button');
            cardHeader.className = `w-full text-left px-4 py-3 text-white font-semibold flex justify-between items-center ${sec.headerBg} hover:opacity-95 transition-opacity`;
            cardHeader.innerHTML = `
              <div class="flex items-center">
                <span>${sec.label}</span>
                ${dateHTML}
              </div>
              <span class="text-xs opacity-75 arrow-icon">▶</span>
            `;

            // Contingut desplegable (Accordion Content)
            const cardContent = document.createElement('div');
            cardContent.className = 'accordion-content border-t border-slate-100 bg-slate-50';

            const list = document.createElement('div');
            list.className = 'divide-y divide-slate-100';

            sec.items.forEach(item => {
              const link = document.createElement('a');
              link.href = item.path;
              link.target = '_blank';
              link.className = 'block px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100 hover:text-blue-600 transition-colors flex justify-between items-center';
              link.innerHTML = `
                <span>${item.name}</span>
                <span class="text-slate-400 text-xs">↗</span>
              `;
              list.appendChild(link);
            });

            cardContent.appendChild(list);
            card.appendChild(cardHeader);
            card.appendChild(cardContent);
            app.appendChild(card);

            // Esdeveniment d'obertura/tancament de l'acordió
            cardHeader.addEventListener('click', () => {
              const isOpen = cardContent.classList.contains('open');
              const arrow = cardHeader.querySelector('.arrow-icon');

              if (isOpen) {
                cardContent.classList.remove('open');
                arrow.classList.remove('open');
              } else {
                cardContent.classList.add('open');
                arrow.classList.add('open');
              }
            });
          });
        })
        .catch(error => {
          console.error(error);
          document.getElementById('app').innerHTML = `
            <div class="p-4 bg-red-50 text-red-700 rounded-xl text-center text-sm border border-red-200">
              Error en carregar les classificacions. Si us plau, torna-ho a intentar més tard.
            </div>
          `;
        });
    });
  </script>
</body>
</html>
