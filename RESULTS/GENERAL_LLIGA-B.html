    </div><script>
        document.addEventListener("DOMContentLoaded", function() {
          const TOTAL_MANGAS = 8;
          const MARGEN_PROBABLE = 0.15;
          const PUNTOS_MAX_MANGA = 1000;
          const FTV_FACTOR = 0.33;

          const tablas = document.querySelectorAll("table.fs_res");
          const tablaPilotos = tablas[tablas.length - 1];
          if (!tablaPilotos) return;

  const filas = Array.from(tablaPilotos.querySelectorAll("tr.fs_res_res_row, tbody tr"))
    .filter(row => row.querySelectorAll("td").length > 6);

  if (filas.length === 0) return;

  const mangasValidas = Math.max(1, Math.round(TOTAL_MANGAS * (1 - FTV_FACTOR)));

  const datosPilotos = filas.map((row) => {
    const celdas = row.querySelectorAll("td");
    const numMangasDisputadas = celdas.length - 9;
    const mangasRestantes = Math.max(0, TOTAL_MANGAS - numMangasDisputadas);

    let puntosMangas = [];
    for (let i = 7; i < 7 + numMangasDisputadas; i++) {
      let val = parseFloat(celdas[i].textContent.replace(',', '.').replace(/[^0-9.]/g, '')) || 0;
      puntosMangas.push(val);
    }

    const promedioPiloto = numMangasDisputadas > 0 ? (puntosMangas.reduce((a, b) => a + b, 0) / numMangasDisputadas) : 0;

    let mangasMax = [...puntosMangas];
    for (let i = 0; i < mangasRestantes; i++) mangasMax.push(PUNTOS_MAX_MANGA);
    mangasMax.sort((a, b) => b - a);
    const maxProyectado = mangasMax.slice(0, mangasValidas).reduce((a, b) => a + b, 0);

    let mangasMin = [...puntosMangas];
    for (let i = 0; i < mangasRestantes; i++) mangasMin.push(0);
    mangasMin.sort((a, b) => b - a);
    const minProyectado = mangasMin.slice(0, mangasValidas).reduce((a, b) => a + b, 0);

    let mangasProbMax = [...puntosMangas];
    const promMax = Math.min(PUNTOS_MAX_MANGA, promedioPiloto * (1 + MARGEN_PROBABLE));
    for (let i = 0; i < mangasRestantes; i++) mangasProbMax.push(promMax);
    mangasProbMax.sort((a, b) => b - a);
    const probMaxProyectado = mangasProbMax.slice(0, mangasValidas).reduce((a, b) => a + b, 0);

    let mangasProbMin = [...puntosMangas];
    const promMin = promedioPiloto * (1 - MARGEN_PROBABLE);
    for (let i = 0; i < mangasRestantes; i++) mangasProbMin.push(promMin);
    mangasProbMin.sort((a, b) => b - a);
    const probMinProyectado = mangasProbMin.slice(0, mangasValidas).reduce((a, b) => a + b, 0);

    return {
      celdaResultado: celdas[celdas.length - 1],
      mangasRestantes: mangasRestantes,
      maxProyectado: maxProyectado,
      minProyectado: minProyectado,
      probMaxProyectado: probMaxProyectado,
      probMinProyectado: probMinProyectado
    };
  });

  datosPilotos.forEach(p => {
    if (p.mangasRestantes === 0) {
      p.celdaResultado.textContent = "Final";
      return;
    }

    const mejorPuesto = datosPilotos.filter(o => o.minProyectado > p.maxProyectado).length + 1;
    const peorPuesto = datosPilotos.filter(o => o.maxProyectado >= p.minProyectado).length;

    const mejorProbable = datosPilotos.filter(o => o.probMinProyectado > p.probMaxProyectado).length + 1;
    const peorProbable = datosPilotos.filter(o => o.probMaxProyectado >= p.probMinProyectado).length;

    const textoProbable = (mejorProbable === peorProbable) ? `${mejorProbable}º` : `${mejorProbable}º-${peorProbable}º`;
    p.celdaResultado.textContent = `${mejorPuesto}º - ${peorPuesto}º (${textoProbable})`;
  });
});
</script></body>
