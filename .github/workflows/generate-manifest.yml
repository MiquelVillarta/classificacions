name: Generate Manifest JSON

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Execute Python script to update manifest
        run: |
          python -c "
          import os, json, sqlite3
          from datetime import datetime

          manifest = {
              'updated_at': datetime.now().strftime('%d/%m/%Y %H:%M'),
              'generals': [],
              'campionat': [],
              'tasks': {}
          }

          results_dir = 'RESULTS'

          ORDER_KEYWORDS = [
              ('B_', 7),
              ('LLIGA-B', 7),
              ('CAMPIONAT B', 7),
              ('SERIAL', 2),
              ('SPORT', 3),
              ('EQUIPS', 5),
              ('LLICENCIA', 5),
              ('FEMINES', 6),
              ('CLUB', 4),
              ('GENERAL', 1)
          ]

          def get_sort_key(item):
              name = item['name'].upper()
              score = 99
              for key, val in ORDER_KEYWORDS:
                  if key in name:
                      score = val
                      break
              return (score, name)

          if os.path.exists(results_dir):
              for root, dirs, files in os.walk(results_dir):
                  for file in files:
                      if file.endswith('.html'):
                          full_path = os.path.join(root, file).replace('\\\\', '/')
                          name = os.path.splitext(file)[0]
                          folder_name = os.path.basename(root)

                          item_data = {'name': name, 'path': full_path}

                          if folder_name == 'RESULTS':
                              manifest['generals'].append(item_data)
                          elif folder_name == 'CAMPIONAT CAT':
                              manifest['campionat'].append(item_data)
                          elif folder_name.startswith('T'):
                              task_key = folder_name
                              if task_key not in manifest['tasks']:
                                  manifest['tasks'][task_key] = {'date': '', 'items': []}
                              manifest['tasks'][task_key]['items'].append(item_data)

          manifest['generals'].sort(key=get_sort_key)
          manifest['campionat'].sort(key=get_sort_key)

          for db_file in ['LLIGA_A.fsdb', 'LLIGA_B.fsdb', 'RESULTS/LLIGA_A.fsdb', 'RESULTS/LLIGA_B.fsdb']:
              if os.path.exists(db_file):
                  try:
                      conn = sqlite3.connect(db_file)
                      cursor = conn.cursor()
                      cursor.execute(\"SELECT name FROM sqlite_master WHERE type='table';\")
                      tables = [t[0] for t in cursor.fetchall()]

                      for table in tables:
                          cursor.execute(f'PRAGMA table_info({table})')
                          cols = [c[1].lower() for c in cursor.fetchall()]
                          id_col = next((c for c in cols if 'task' in c and 'id' in c) or (c for c in cols if c == 'id'), None)
                          date_col = next((c for c in cols if 'date' in c or 'dt' in c), None)

                          if id_col and date_col:
                              cursor.execute(f'SELECT {id_col}, {date_col} FROM {table} WHERE {date_col} IS NOT NULL')
                              for row in cursor.fetchall():
                                  if row[0] is not None:
                                      try:
                                          t_num = int(row[0])
                                          t_key = f'T{t_num:02d}'
                                          raw_date = str(row[1]).split(' ')[0]
                                          if t_key in manifest['tasks'] and raw_date:
                                              manifest['tasks'][t_key]['date'] = raw_date
                                      except ValueError:
                                          pass
                      conn.close()
                  except Exception as e:
                      print(f'Error llegint {db_file}: {e}')

          for t_key in manifest['tasks']:
              manifest['tasks'][t_key]['items'].sort(key=get_sort_key)

          manifest['tasks'] = dict(sorted(manifest['tasks'].items()))

          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          "

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fix YAML syntax and sorting priority" && git push)