name: Generate Classification Manifest

on:
  push:
    paths:
      - 'RESULTS/**'
      - '**/*.fsdb'
permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 -c "
          import os, json, glob
          import xml.etree.ElementTree as ET
          from datetime import datetime
          import zoneinfo

          MESOS = ['gen', 'feb', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'des']

          # Obtenir la data i hora actual d'actualització
          tz = zoneinfo.ZoneInfo('Europe/Madrid')
          now = datetime.now(tz)
          updated_at_str = f'{now.day:02d}/{MESOS[now.month - 1]}/{now.year} {now.strftime(\"%H:%M\")}'

          def clean_display_name(filename):
              name = os.path.splitext(filename)[0]
              name = name.rstrip('_').rstrip()
              return name.upper()

          def get_task_dates():
              dates = {}
              fsdb_files = glob.glob('**/*.fsdb', recursive=True)
              if not fsdb_files:
                  return dates

              for fsdb_path in fsdb_files:
                  try:
                      tree = ET.parse(fsdb_path)
                      root = tree.getroot()
                      for task in root.findall('.//FsTask'):
                          task_id = task.get('id')
                          if task_id:
                              task_key = f'T{int(task_id):02d}'
                              tp = task.find('.//FsTurnpoint')
                              if tp is not None and tp.get('open'):
                                  raw_date = tp.get('open').split('T')[0]
                                  dt = datetime.strptime(raw_date, '%Y-%m-%d')
                                  dates[task_key] = f'{dt.day:02d}/{MESOS[dt.month - 1]}/{dt.year}'
                  except Exception as e:
                      print(f'Error processant {fsdb_path}: {e}')
              return dates

          task_dates = get_task_dates()

          KEYWORD_PRIORITY = [
              '_GENERAL', '_SERIAL', '_SPORT', '_CLUB', 'EQUIPS', '_FEMINES', 'B_'
          ]

          GENERAL_PRIORITY = [
              'GENERAL', 'GENERAL_SERIAL', 'GENERAL_SPORT', 'GENERAL_CLUB', 
              'GENERAL_EQUIPS-CLUBS', 'GENERAL_FEMINES', 'GENERAL_LLIGA-B'
          ]

          results_dir = 'RESULTS'
          manifest = {
              'updated_at': updated_at_str,
              'generals': [], 
              'campionat': [], 
              'tasks': {}
          }

          if os.path.exists(results_dir):
              for root, dirs, files in os.walk(results_dir):
                  for file in sorted(files):
                      if file.endswith('.html'):
                          full_path = os.path.join(root, file).replace('\\\\', '/')
                          display_name = clean_display_name(file)
                          rel_path = os.path.relpath(root, results_dir)
                          
                          if rel_path in ['.', ''] or rel_path.upper() == 'GENERALS':
                              manifest['generals'].append({'name': display_name, 'path': full_path})
                          elif rel_path.upper().startswith('CAMPIONAT'):
                              manifest['campionat'].append({'name': display_name, 'path': full_path})
                          else:
                              task_key = rel_path.upper()
                              if task_key not in manifest['tasks']:
                                  manifest['tasks'][task_key] = {
                                      'date': task_dates.get(task_key, ''),
                                      'items': []
                                  }
                              manifest['tasks'][task_key]['items'].append({'name': display_name, 'path': full_path})

          def get_task_priority(item):
              name = item['name']
              for index, key in enumerate(KEYWORD_PRIORITY):
                  if key in name:
                      if key == '_GENERAL' and name.startswith('B_'):
                          continue
                      return index
              return 50

          manifest['generals'].sort(key=lambda x: GENERAL_PRIORITY.index(x['name']) if x['name'] in GENERAL_PRIORITY else 99)

          for task_key in manifest['tasks']:
              manifest['tasks'][task_key]['items'].sort(key=get_task_priority)

          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          "

      - name: Commit and push manifest.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add manifest.json
          git diff --staged --quiet || (git commit -m "Auto-update manifest.json with updated_at" && git push)