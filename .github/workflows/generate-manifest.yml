name: Generate Manifest JSON

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Execute Python script to update manifest
        run: |
          python -c "
          import os, re, json
          import xml.etree.ElementTree as ET
          from datetime import datetime

          manifest = {
              'updated_at': datetime.now().strftime('%d/%m/%Y %H:%M'),
              'years': {},
              'latest_year': None
          }

          ORDER_KEYWORDS = [
              ('B_', 7),
              ('LLIGA-B', 7),
              ('CAMPIONAT B', 7),
              ('SERIAL', 2),
              ('SPORT', 3),
              ('EQUIPS', 5),
              ('LLICENCIA', 5),
              ('FEMINES', 6),
              ('CLUB', 4),
              ('GENERAL', 1)
          ]

          def get_sort_key(item):
              name = item['name'].upper()
              score = 99
              for key, val in ORDER_KEYWORDS:
                  if key in name:
                      score = val
                      break
              return (score, name)

          def task_date_from_element(task_el):
              definition = task_el.find('FsTaskDefinition')
              if definition is not None:
                  tp = definition.find('FsTurnpoint')
                  if tp is not None and tp.get('open'):
                      return tp.get('open')[:10]
              folder = task_el.get('tracklog_folder') or ''
              for i in range(len(folder) - 7):
                  chunk = folder[i:i + 8]
                  if chunk.isdigit():
                      return chunk[0:4] + '-' + chunk[4:6] + '-' + chunk[6:8]
              return ''

          def format_date(iso_date):
              try:
                  return datetime.strptime(iso_date, '%Y-%m-%d').strftime('%d/%m/%Y')
              except ValueError:
                  return iso_date

          # Detecta automàticament totes les carpetes d'any (2026, 2027, ...) a l'arrel
          year_dirs = sorted(
              d for d in os.listdir('.')
              if os.path.isdir(d) and re.fullmatch(r'20\d{2}', d)
          )

          for year in year_dirs:
              year_data = {'generals': [], 'campionat': [], 'tasks': {}}
              results_dir = os.path.join(year, 'RESULTS')

              if os.path.exists(results_dir):
                  for root, dirs, files in os.walk(results_dir):
                      for file in files:
                          if file.endswith('.html'):
                              full_path = os.path.join(root, file).replace('\\\\', '/')
                              name = os.path.splitext(file)[0]
                              folder_name = os.path.basename(root)
                              item_data = {'name': name, 'path': full_path}

                              if folder_name == 'RESULTS':
                                  year_data['generals'].append(item_data)
                              elif folder_name == 'CAMPIONAT CAT':
                                  year_data['campionat'].append(item_data)
                              elif folder_name.startswith('T'):
                                  task_key = folder_name
                                  if task_key not in year_data['tasks']:
                                      year_data['tasks'][task_key] = {'date': '', 'items': []}
                                  year_data['tasks'][task_key]['items'].append(item_data)

              year_data['generals'].sort(key=get_sort_key)
              year_data['campionat'].sort(key=get_sort_key)

              for fsdb_rel in ['LLIGA_A.fsdb', 'LLIGA_B.fsdb', 'RESULTS/LLIGA_A.fsdb', 'RESULTS/LLIGA_B.fsdb']:
                  fsdb_file = os.path.join(year, fsdb_rel)
                  if os.path.exists(fsdb_file):
                      try:
                          tree = ET.parse(fsdb_file)
                          xml_root = tree.getroot()
                          for task_el in xml_root.iter('FsTask'):
                              raw_id = task_el.get('id')
                              if raw_id is None:
                                  continue
                              try:
                                  t_num = int(raw_id)
                              except ValueError:
                                  continue
                              t_key = f'T{t_num:02d}'
                              if t_key not in year_data['tasks']:
                                  continue
                              iso_date = task_date_from_element(task_el)
                              if iso_date:
                                  year_data['tasks'][t_key]['date'] = format_date(iso_date)
                      except ET.ParseError as e:
                          print(f'Error llegint {fsdb_file}: {e}')

              for t_key in year_data['tasks']:
                  year_data['tasks'][t_key]['items'].sort(key=get_sort_key)
              year_data['tasks'] = dict(sorted(year_data['tasks'].items()))

              manifest['years'][year] = year_data

          if year_dirs:
              manifest['latest_year'] = year_dirs[-1]

          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          "

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update manifest" && git push)
