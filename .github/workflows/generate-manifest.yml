name: Generate Manifest JSON

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Execute Python script to update manifest
        run: |
          python -c "
          import os, json
          import xml.etree.ElementTree as ET
          from datetime import datetime

          manifest = {
              'updated_at': datetime.now().strftime('%d/%m/%Y %H:%M'),
              'generals': [],
              'campionat': [],
              'tasks': {}
          }

          results_dir = 'RESULTS'

          ORDER_KEYWORDS = [
              ('B_', 7),
              ('LLIGA-B', 7),
              ('CAMPIONAT B', 7),
              ('SERIAL', 2),
              ('SPORT', 3),
              ('EQUIPS', 5),
              ('LLICENCIA', 5),
              ('FEMINES', 6),
              ('CLUB', 4),
              ('GENERAL', 1)
          ]

          def get_sort_key(item):
              name = item['name'].upper()
              score = 99
              for key, val in ORDER_KEYWORDS:
                  if key in name:
                      score = val
                      break
              return (score, name)

          if os.path.exists(results_dir):
              for root, dirs, files in os.walk(results_dir):
                  for file in files:
                      if file.endswith('.html'):
                          full_path = os.path.join(root, file).replace('\\\\', '/')
                          name = os.path.splitext(file)[0]
                          folder_name = os.path.basename(root)

                          item_data = {'name': name, 'path': full_path}

                          if folder_name == 'RESULTS':
                              manifest['generals'].append(item_data)
                          elif folder_name == 'CAMPIONAT CAT':
                              manifest['campionat'].append(item_data)
                          elif folder_name.startswith('T'):
                              task_key = folder_name
                              if task_key not in manifest['tasks']:
                                  manifest['tasks'][task_key] = {'date': '', 'items': []}
                              manifest['tasks'][task_key]['items'].append(item_data)

          manifest['generals'].sort(key=get_sort_key)
          manifest['campionat'].sort(key=get_sort_key)

          def task_date_from_element(task_el):
              # 1) Fecha del primer FsTurnpoint 'open' (igual que fa visor.html)
              definition = task_el.find('FsTaskDefinition')
              if definition is not None:
                  tp = definition.find('FsTurnpoint')
                  if tp is not None and tp.get('open'):
                      return tp.get('open')[:10]
              # 2) Fallback: patró de 8 dígits dins de tracklog_folder
              folder = task_el.get('tracklog_folder') or ''
              for i in range(len(folder) - 7):
                  chunk = folder[i:i + 8]
                  if chunk.isdigit():
                      return chunk[0:4] + '-' + chunk[4:6] + '-' + chunk[6:8]
              return ''

          def format_date(iso_date):
              try:
                  return datetime.strptime(iso_date, '%Y-%m-%d').strftime('%d/%m/%Y')
              except ValueError:
                  return iso_date

          # Els fitxers .fsdb son XML (no SQLite), tal com els llegeix visor.html
          for fsdb_file in ['LLIGA_A.fsdb', 'LLIGA_B.fsdb', 'RESULTS/LLIGA_A.fsdb', 'RESULTS/LLIGA_B.fsdb']:
              if os.path.exists(fsdb_file):
                  try:
                      tree = ET.parse(fsdb_file)
                      xml_root = tree.getroot()
                      for task_el in xml_root.iter('FsTask'):
                          raw_id = task_el.get('id')
                          if raw_id is None:
                              continue
                          try:
                              t_num = int(raw_id)
                          except ValueError:
                              continue
                          t_key = f'T{t_num:02d}'
                          if t_key not in manifest['tasks']:
                              continue
                          iso_date = task_date_from_element(task_el)
                          if iso_date:
                              manifest['tasks'][t_key]['date'] = format_date(iso_date)
                  except ET.ParseError as e:
                      print(f'Error llegint {fsdb_file}: {e}')

          for t_key in manifest['tasks']:
              manifest['tasks'][t_key]['items'].sort(key=get_sort_key)

          manifest['tasks'] = dict(sorted(manifest['tasks'].items()))

          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          "

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Extract task date from fsdb XML" && git push)
