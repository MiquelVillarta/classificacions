name: Generate Manifest JSON

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Execute Python script to update manifest
        run: |
          python -c "
          import os, json, sqlite3
          from datetime import datetime

          manifest = {
              'updated_at': datetime.now().strftime('%d/%m/%Y %H:%M'),
              'generals': [],
              'campionat': [],
              'tasks': {}
          }

          results_dir = 'RESULTS'

          # Regles d'ordenació personalitzades
          order_keywords = ['GENERAL', 'SERIAL', 'SPORT', 'CLUB', 'FEMINES', 'EQUIPS', 'LLIGA-B', 'LLICENCIA']
          
          def get_sort_key(item):
              name = item['name'].upper()
              prefix_score = 0 if name.startswith('A_') else (1 if name.startswith('B_') else 0)
              
              index_score = 99
              for idx, kw in enumerate(order_keywords):
                  if kw in name:
                      index_score = idx
                      break
              return (prefix_score, index_score, name)

          # 1. Escanejar arxius HTML
          if os.path.exists(results_dir):
              for root, dirs, files in os.walk(results_dir):
                  for file in files:
                      if file.endswith('.html'):
                          full_path = os.path.join(root, file).replace('\\\\', '/')
                          name = os.path.splitext(file)[0]
                          folder_name = os.path.basename(root)

                          item_data = {'name': name, 'path': full_path}

                          if folder_name == 'RESULTS':
                              manifest['generals'].append(item_data)
                          elif folder_name == 'CAMPIONAT CAT':
                              manifest['campionat'].append(item_data)
                          elif folder_name.startswith('T'):
                              task_key = folder_name
                              if task_key not in manifest['tasks']:
                                  manifest['tasks'][task_key] = {'date': '', 'items': []}
                              manifest['tasks'][task_key]['items'].append(item_data)

          # Reordenar llistes internament
          manifest['generals'].sort(key=get_sort_key)
          manifest['campionat'].sort(key=get_sort_key)

          # 2. Extreure dates de les bases de dades .fsdb
          for db_file in ['LLIGA_A.fsdb', 'LLIGA_B.fsdb']:
              if os.path.exists(db_file):
                  try:
                      conn = sqlite3.connect(db_file)
                      cursor = conn.cursor()
                      
                      # Comprovar columnes disponibles a la taula tasks
                      cursor.execute('PRAGMA table_info(tasks)')
                      cols = [col[1] for col in cursor.fetchall()]
                      
                      date_col = 'task_date' if 'task_date' in cols else ('date' if 'date' in cols else None)
                      id_col = 'task_id' if 'task_id' in cols else ('id' if 'id' in cols else None)

                      if id_col and date_col:
                          cursor.execute(f'SELECT {id_col}, {date_col} FROM tasks')
                          for row in cursor.fetchall():
                              if row[0] is not None and row[1]:
                                  t_key = f'T{int(row[0]):02d}'
                                  if t_key in manifest['tasks']:
                                      manifest['tasks'][t_key]['date'] = str(row[1])
                      conn.close()
                  except Exception as e:
                      print(f'Error llegint {db_file}: {e}')

          # Ordenar elements de cada tasca
          for t_key in manifest['tasks']:
              manifest['tasks'][t_key]['items'].sort(key=get_sort_key)

          manifest['tasks'] = dict(sorted(manifest['tasks'].items()))

          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          "

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fix sorting and fetch task dates" && git push)