name: Generate Classification Manifest

on:
  push:
    paths:
      - 'RESULTS/**'
permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 -c "
          import os, json

          def clean_display_name(filename):
              name = os.path.splitext(filename)[0]
              name = name.rstrip('_').rstrip()
              return name.upper()

          # Orden de prioridad exacto para las clasificaciones de cada manga (T01, T02...)
          KEYWORD_PRIORITY = [
              '_GENERAL',   # 1º A_T01_GENERAL
              '_SERIAL',    # 2º A_T01_SERIAL
              '_SPORT',     # 3º A_T01_SPORT
              '_CLUB',      # 4º A_T01_CLUB
              'EQUIPS',     # 5ºIntermedio si existe
              '_FEMINES',   # 6ºClasificación Femenina
              'B_'          # 7º B_T01_GENERAL (Liga B al final)
          ]

          # Prioridad explícita para el bloque de GENERALES de la raíz
          GENERAL_PRIORITY = [
              'GENERAL',
              'GENERAL_SERIAL',
              'GENERAL_SPORT',
              'GENERAL_CLUB',
              'GENERAL_EQUIPS-CLUBS',
              'GENERAL_FEMINES',
              'GENERAL_LLIGA-B'
          ]

          results_dir = 'RESULTS'
          manifest = {'generals': [], 'campionat': [], 'tasks': {}}

          if os.path.exists(results_dir):
              for root, dirs, files in os.walk(results_dir):
                  for file in sorted(files):
                      if file.endswith('.html'):
                          full_path = os.path.join(root, file).replace('\\\\', '/')
                          display_name = clean_display_name(file)
                          rel_path = os.path.relpath(root, results_dir)
                          
                          if rel_path in ['.', ''] or rel_path.upper() == 'GENERALS':
                              manifest['generals'].append({'name': display_name, 'path': full_path})
                          elif rel_path.upper().startswith('CAMPIONAT'):
                              manifest['campionat'].append({'name': display_name, 'path': full_path})
                          else:
                              task_key = rel_path.upper()
                              if task_key not in manifest['tasks']:
                                  manifest['tasks'][task_key] = []
                              manifest['tasks'][task_key].append({'name': display_name, 'path': full_path})

          # Función de ordenación para los ficheros de las pruebas/mangas
          def get_task_priority(item):
              name = item['name']
              
              for index, key in enumerate(KEYWORD_PRIORITY):
                  if key in name:
                      # Si coincide con _GENERAL pero es de Liga B (ej. B_T01_GENERAL), ignora '_GENERAL' para asignarle la prioridad de 'B_' (al final)
                      if key == '_GENERAL' and name.startswith('B_'):
                          continue
                      return index
              return 50 # Archivos no contemplados quedan en medio

          # 1. Ordenar bloque 'generals'
          manifest['generals'].sort(key=lambda x: GENERAL_PRIORITY.index(x['name']) if x['name'] in GENERAL_PRIORITY else 99)

          # 2. Ordenar bloques de cada manga 'tasks' (T01, T02...)
          for task_key in manifest['tasks']:
              manifest['tasks'][task_key].sort(key=get_task_priority)

          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          "

      - name: Commit and push manifest.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || (git commit -m "Auto-update manifest.json" && git push)