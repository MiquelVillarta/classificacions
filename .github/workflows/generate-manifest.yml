name: Generate Manifest JSON

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Execute Python script to update manifest
        run: |
          python -c "
          import os, json, sqlite3
          from datetime import datetime

          manifest = {
              'updated_at': datetime.now().strftime('%d/%m/%Y %H:%M'),
              'generals': [],
              'campionat': [],
              'tasks': {}
          }

          results_dir = 'RESULTS'

          # 1. Escanejar fitxers HTML
          if os.path.exists(results_dir):
              for root, dirs, files in os.walk(results_dir):
                  for file in files:
                      if file.endswith('.html'):
                          full_path = os.path.join(root, file).replace('\\\\', '/')
                          name = os.path.splitext(file)[0]
                          folder_name = os.path.basename(root)

                          if folder_name == 'RESULTS':
                              manifest['generals'].append({'name': name, 'path': full_path})
                          elif folder_name == 'CAMPIONAT CAT':
                              manifest['campionat'].append({'name': name, 'path': full_path})
                          elif folder_name.startswith('T'):
                              task_key = folder_name
                              if task_key not in manifest['tasks']:
                                  manifest['tasks'][task_key] = {'date': '', 'items': []}
                              manifest['tasks'][task_key]['items'].append({'name': name, 'path': full_path})

          # 2. Llegir dates des de les bases de dades .fsdb
          for db_file in ['LLIGA_A.fsdb', 'LLIGA_B.fsdb']:
              if os.path.exists(db_file):
                  try:
                      conn = sqlite3.connect(db_file)
                      cursor = conn.cursor()
                      cursor.execute('SELECT task_id, task_date FROM tasks')
                      for row in cursor.fetchall():
                          t_id, t_date = row[0], row[1]
                          t_key = f'T{int(t_id):02d}'
                          if t_key in manifest['tasks']:
                              manifest['tasks'][t_key]['date'] = t_date
                      conn.close()
                  except Exception as e:
                      print(f'Error llegint {db_file}: {e}')

          # Sort de les tasques
          manifest['tasks'] = dict(sorted(manifest['tasks'].items()))

          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          "

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update manifest.json with dates" && git push)