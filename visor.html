<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Lliga Catalana · Visor de mangas i tracks</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --panel-bg: rgba(20,24,22,0.92);
    --panel-border: #2f3a34;
    --accent: #6fae4a;
    --accent-2: #d98c3a;
    --text: #eef1ee;
    --text-dim: #9fb0a6;
    --danger: #d9534a;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#10130f;}
  #map{position:absolute;inset:0;}

  #panel{
    position:absolute;top:12px;left:12px;z-index:1000;
    width:320px;max-width:calc(100vw - 24px);
    background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:var(--radius);
    color:var(--text);backdrop-filter:blur(6px);
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden;
  }
  #panel-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-bottom:1px solid var(--panel-border);
  }
  #panel-header h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.02em;color:var(--accent);}
  #panel-header .sub{font-size:10px;color:var(--text-dim);margin-top:2px;}
  #collapse-btn{
    background:none;border:1px solid var(--panel-border);color:var(--text-dim);
    border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;
  }
  #panel-body{padding:12px 14px;overflow-y:auto;}
  #panel.collapsed #panel-body{display:none;}

  label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;margin-top:10px;text-transform:uppercase;letter-spacing:.04em;}
  label:first-child{margin-top:0;}
  select,button.btn,input[type="range"]{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--panel-border);
    background:#1b211d;color:var(--text);font-size:13px;
  }
  select:focus,button.btn:focus,input[type="range"]:focus{outline:1px solid var(--accent);}
  .row{display:flex;gap:6px;}
  .row select{flex:1;}
  button.btn{cursor:pointer;background:#233024;border-color:#37483b;transition:background .15s;}
  button.btn:hover{background:#2c3c2e;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}
  button.btn.primary{background:var(--accent);color:#0e150f;border-color:var(--accent);font-weight:600;}
  button.btn.primary:hover{background:#7cc257;}

  #time-control-container {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: calc(100% - 32px);
    max-width: 580px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 8px 14px;
    color: var(--text);
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .time-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #time-display {
    font-family: monospace;
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
    min-width: 70px;
  }
  #time-slider {
    flex: 1;
    cursor: pointer;
    height: 5px;
    accent-color: var(--accent);
  }
  .btn.time-btn-small {
    width: 32px;
    height: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    border-radius: 6px;
    flex: none;
  }
  .speed-select {
    width: auto;
    padding: 4px 6px;
    font-size: 11px;
    height: 32px;
  }

  .pilot-live-marker {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 2px solid #ffffff;
    color: #ffffff;
    font-weight: bold;
    font-size: 10px;
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
  }

  #task-info{
    margin-top:10px;padding:8px 10px;background:#171c18;border-radius:8px;font-size:11.5px;color:var(--text-dim);
    line-height:1.5;
  }
  #task-info b{color:var(--text);}

  #legend{margin-top:10px;font-size:11px;color:var(--text-dim);display:flex;flex-wrap:wrap;gap:6px 12px;}
  #legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}

  #pilots-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .pilot-item{
    display:flex;align-items:center;gap:8px;background:#171c18;border-radius:8px;padding:7px 8px;font-size:12px;
    border-left:4px solid transparent;cursor:pointer;
  }
  .pilot-item:hover{background:#1e2620;}
  .pilot-swatch{width:11px;height:11px;border-radius:50%;flex:none;}
  .pilot-main{flex:1;min-width:0;}
  .pilot-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pilot-stats{color:var(--text-dim);font-size:10.5px;margin-top:1px;}
  .pilot-remove{
    background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;flex:none;
  }
  .pilot-remove:hover{color:var(--danger);}

  #status{
    margin-top:10px;font-size:11px;min-height:14px;color:var(--text-dim);
  }
  #status.error{color:var(--danger);}
  #status.ok{color:var(--accent);}

  #file-banner{
    position:absolute;bottom:12px;left:12px;right:12px;z-index:1000;
    background:#3a2420;border:1px solid #6b3a30;color:#f2d5cf;
    padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.5;display:none;
    max-width:520px;
  }

  .leaflet-popup-content{font-size:12.5px;line-height:1.5;}
  .leaflet-popup-content b{display:block;margin-bottom:2px;}

  .tp-label{
    background:rgba(15,18,15,0.82);color:#fff;border:none;box-shadow:none;
    font-size:11px;font-weight:700;padding:1px 5px;border-radius:4px;
  }
  .tp-label::before{display:none;}
  .landing-label{
    background:rgba(15,18,15,0.88);border:1px solid rgba(255,255,255,0.25);box-shadow:none;
    font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:5px;
  }
  .landing-label.goal{color:#7cc257;}
  .landing-label.nogoal{color:#f2b23a;}
  .landing-label::before{display:none;}
  .crossing-marker{cursor:pointer;}

  @media (max-width:480px){
    #panel{width:calc(100vw - 24px);} 
    #time-control-container{width:calc(100vw - 24px);bottom: 12px;}
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <div id="panel-header">
    <div>
      <h1>Lliga Catalana</h1>
      <div class="sub">Visor de mangues i tracks</div>
    </div>
    <button id="collapse-btn" title="Mostrar/amagar">−</button>
  </div>
  <div id="panel-body">
    <label for="competition-select">Competició</label>
    <select id="competition-select"></select>

    <label for="task-select">Manga</label>
    <select id="task-select"><option value="">Carregant fsdb…</option></select>

    <label for="basemap-select">Mapa base</label>
    <select id="basemap-select">
      <option value="esri" selected>Esri Topogràfic</option>
      <option value="otm">OpenTopoMap</option>
    </select>

    <div id="task-info" style="display:none;"></div>

    <div id="legend"></div>

    <label for="pilot-select">Afegir pilot</label>
    <div class="row">
      <select id="pilot-select" disabled><option value="">—</option></select>
      <button id="add-pilot-btn" class="btn primary" style="width:auto;padding:8px 12px;" disabled>+</button>
    </div>

    <div id="pilots-list"></div>

    <button id="share-btn" class="btn" style="margin-top:12px;">🔗 Copiar enlace de esta vista</button>

    <div id="status"></div>
  </div>
</div>

<div id="time-control-container" style="display:none;">
  <div class="time-row">
    <button id="play-btn" class="btn time-btn-small primary" title="Play/Pausa">▶</button>
    <input type="range" id="time-slider" min="0" max="100" value="0" step="1"/>
    <span id="time-display">--:--:--</span>
    <select id="speed-select" class="speed-select">
      <option value="1">1x</option>
      <option value="5">5x</option>
      <option value="10">10x</option>
      <option value="30">30x</option>
      <option value="60" selected>60x</option>
    </select>
  </div>
</div>

<div id="file-banner"></div>

<script>
/**
 * Carga y parsea el archivo FSDB especificado (LLIGA_A.fsdb / LLIGA_B.fsdb -- intenta también lliga_a/lliga_b en minúsculas)
 * para obtener el nombre del fichero IGC asignado a cada piloto en una manga determinada.
 * 
 * @param {string} liga - 'a' o 'b' para seleccionar LLIGA_A.fsdb o LLIGA_B.fsdb
 * @param {string|number} taskId - Número o ID de la manga (task)
 * @returns {Promise<Map<string, string>>} Mapa de civlId/pilotId -> nombre_fichero_IGC
 */
async function obtenerTracksMangaDesdeFSDB(liga, taskId) {
  // Construir candidatos (intentar tanto mayúsculas como minúsculas por compatibilidad)
  const base = (liga && liga.toLowerCase() === 'b') ? 'LLIGA_B' : 'LLIGA_A';
  const candidates = [`./${base}.fsdb`, `./${base.toLowerCase()}.fsdb`];

  let xmlText = null;
  let fsdbFile = null;

  for (const candidate of candidates) {
    try {
      const response = await fetch(candidate);
      if (response.ok) {
        xmlText = await response.text();
        fsdbFile = candidate;
        break;
      }
    } catch (err) {
      // continuar a siguiente candidato
    }
  }

  if (!xmlText) {
    console.error(`No se pudo cargar ninguno de los archivos FSDB: ${candidates.join(', ')}`);
    return new Map();
  }

  try {
    // Parsear el contenido XML del FSDB
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");

    // Buscar la manga (FsTask) por su id o número
    const tasks = xmlDoc.getElementsByTagName("FsTask");
    let targetTask = null;

    for (let task of tasks) {
      const id = task.getAttribute("id");
      const num = task.getAttribute("number") || task.getAttribute("task_number");
      if (id == taskId || num == taskId) {
        targetTask = task;
        break;
      }
    }

    // Si no coincide exactamente, seleccionar la tarea por índice (si taskId es numérico)
    if (!targetTask && tasks[taskId - 1]) {
      targetTask = tasks[taskId - 1];
    } else if (!targetTask && tasks.length > 0) {
      targetTask = tasks[0];
    }

    const mapaTracks = new Map();

    if (targetTask) {
      const pilots = targetTask.getElementsByTagName("FsPilot");
      for (let pilot of pilots) {
        // Identificador del piloto (civlId, id, o idInComp)
        const pilotId = pilot.getAttribute("civlId") || pilot.getAttribute("id") || pilot.getAttribute("idInComp");

        // Buscar el nodo <FsTracklog>
        const tracklogNode = pilot.getElementsByTagName("FsTracklog")[0];
        let igcFilename = "";

        if (tracklogNode) {
          igcFilename = tracklogNode.getAttribute("filename") || 
                        tracklogNode.getAttribute("file") || 
                        tracklogNode.textContent.trim();
        } else {
          igcFilename = pilot.getAttribute("tracklog") || pilot.getAttribute("igc") || "";
        }

        if (pilotId && igcFilename) {
          // Si el nombre viene con ruta relativa/absoluta, nos quedamos solo con el nombre del fichero
          const cleanFilename = igcFilename.split(/[/\\]/).pop();
          mapaTracks.set(String(pilotId), cleanFilename);
        }
      }
    }

    return mapaTracks;

  } catch (error) {
    console.error("Error al procesar el FSDB:", error);
    return new Map();
  }
}

/**
 * Función para actualizar la UI del visor al cambiar de manga o de liga.
 */
async function cargarMangaUI(liga, taskId) {
  // 1. Obtener los nombres de fichero IGC desde LLIGA_A.fsdb o LLIGA_B.fsdb (intenta también variantes en minúsculas)
  const tracksMap = await obtenerTracksMangaDesdeFSDB(liga, taskId);

  // 2. Recorrer la tabla o lista de pilotos en pantalla
  const filasPilotos = document.querySelectorAll('.fila-piloto'); // Asegúrate de ajustar este selector a tu HTML

  filasPilotos.forEach(row => {
    const civlId = row.dataset.civlId; // ID del piloto asignado a la fila HTML
    const filenameIGC = tracksMap.get(String(civlId));

    const btnTrack = row.querySelector('.btn-igc'); // Selector de tu botón/enlace IGC

    if (filenameIGC) {
      // Ajusta la ruta a donde tengas guardados físicamente los .igc (ej: ./tracks/ o la raíz)
      const urlIGC = `./tracks/${filenameIGC}`; 
      
      if (btnTrack) {
        btnTrack.href = urlIGC;
        btnTrack.textContent = "Ver / Descargar IGC";
        btnTrack.style.display = "inline-block";
      }
    } else {
      if (btnTrack) {
        btnTrack.style.display = "none";
      }
    }
  });
}
</script>

</body>
</html>
