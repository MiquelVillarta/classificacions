<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Visor de proves i tracks</title>
<!-- Favicon de la web -->
  <link rel="icon" type="image/png" href="visor.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --panel-bg: rgba(20,24,22,0.92);
    --panel-border: #2f3a34;
    --accent: #6fae4a;
    --accent-2: #d98c3a;
    --text: #eef1ee;
    --text-dim: #9fb0a6;
    --danger: #d9534a;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#10130f;}
  #map{position:absolute;inset:0;}

  #panel{
    position:absolute;top:12px;left:12px;z-index:1000;
    width:320px;max-width:calc(100vw - 24px);
    background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:var(--radius);
    color:var(--text);backdrop-filter:blur(6px);
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden;
  }
  #panel-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-bottom:1px solid var(--panel-border);
  }
  #panel-header h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.02em;color:var(--accent);}
  #panel-header .sub{font-size:10px;color:var(--text-dim);margin-top:2px;}
  #collapse-btn{
    background:none;border:1px solid var(--panel-border);color:var(--text-dim);
    border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;
  }
  #panel-body{padding:12px 14px;overflow-y:auto;}
  #panel.collapsed #panel-body{display:none;}

  label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;margin-top:10px;text-transform:uppercase;letter-spacing:.04em;}
  label:first-child{margin-top:0;}
  select,button.btn,input[type="range"]{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--panel-border);
    background:#1b211d;color:var(--text);font-size:13px;
  }
  select:focus,button.btn:focus,input[type="range"]:focus{outline:1px solid var(--accent);}
  .row{display:flex;gap:6px;}
  .row select{flex:1;}
  button.btn{cursor:pointer;background:#233024;border-color:#37483b;transition:background .15s;}
  button.btn:hover{background:#2c3c2e;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}
  button.btn.primary{background:var(--accent);color:#0e150f;border-color:var(--accent);font-weight:600;}
  button.btn.primary:hover{background:#7cc257;}

  #time-control-container {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: calc(100% - 32px);
    max-width: 580px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 8px 14px;
    color: var(--text);
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .time-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #time-display {
    font-family: monospace;
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
    min-width: 70px;
  }
  #time-slider {
    flex: 1;
    cursor: pointer;
    height: 5px;
    accent-color: var(--accent);
  }
  .btn.time-btn-small {
    width: 32px;
    height: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    border-radius: 6px;
    flex: none;
  }
  .speed-select {
    width: auto;
    padding: 4px 6px;
    font-size: 11px;
    height: 32px;
  }

  .pilot-live-marker {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 2px solid #ffffff;
    color: #ffffff;
    font-weight: bold;
    font-size: 10px;
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
  }

  #task-info{
    margin-top:10px;padding:8px 10px;background:#171c18;border-radius:8px;font-size:11.5px;color:var(--text-dim);
    line-height:1.5;
  }
  #task-info b{color:var(--text);}

  #legend{margin-top:10px;font-size:11px;color:var(--text-dim);display:flex;flex-wrap:wrap;gap:6px 12px;}
  #legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}

  #pilots-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .pilot-item{
    display:flex;align-items:center;gap:8px;background:#171c18;border-radius:8px;padding:7px 8px;font-size:12px;
    border-left:4px solid transparent;cursor:pointer;
  }
  .pilot-item:hover{background:#1e2620;}
  .pilot-swatch{width:11px;height:11px;border-radius:50%;flex:none;}
  .pilot-main{flex:1;min-width:0;}
  .pilot-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pilot-stats{color:var(--text-dim);font-size:10.5px;margin-top:1px;}
  .pilot-remove{
    background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;flex:none;
  }
  .pilot-remove:hover{color:var(--danger);}

  #status{
    margin-top:10px;font-size:11px;min-height:14px;color:var(--text-dim);
  }
  #status.error{color:var(--danger);}
  #status.ok{color:var(--accent);}

  #file-banner{
    position:absolute;bottom:12px;left:12px;right:12px;z-index:1000;
    background:#3a2420;border:1px solid #6b3a30;color:#f2d5cf;
    padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.5;display:none;
    max-width:520px;
  }

  .leaflet-popup-content{font-size:12.5px;line-height:1.5;}
  .leaflet-popup-content b{display:block;margin-bottom:2px;}

  .tp-label{
    background:rgba(15,18,15,0.82);color:#fff;border:none;box-shadow:none;
    font-size:11px;font-weight:700;padding:1px 5px;border-radius:4px;
  }
  .tp-label::before{display:none;}
  .landing-label{
    background:rgba(15,18,15,0.88);border:1px solid rgba(255,255,255,0.25);box-shadow:none;
    font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:5px;
  }
  .landing-label.goal{color:#7cc257;}
  .landing-label.nogoal{color:#f2b23a;}
  .landing-label::before{display:none;}
  .crossing-marker{cursor:pointer;}

  @media (max-width:480px){
    #panel{width:calc(100vw - 24px);}
    #time-control-container{width:calc(100vw - 24px);bottom: 12px;}
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <div id="panel-header">
    <div>
      <h1>Lliga Catalana 2026</h1>
    </div>
    <button id="collapse-btn" title="Mostrar/amagar">−</button>
  </div>
  <div id="panel-body">
    <label for="competition-select">Competició</label>
    <select id="competition-select"></select>

    <label for="task-select">Prova</label>
    <select id="task-select"><option value="">Carregant fsdb…</option></select>

    <label for="basemap-select">Mapa base</label>
    <select id="basemap-select">
      <option value="esri" selected>Esri Topogràfic</option>
      <option value="otm">OpenTopoMap</option>
    </select>

    <div id="task-info" style="display:none;"></div>

    <div id="legend"></div>

    <label for="pilot-select">Afegir pilot</label>
    <div class="row">
      <select id="pilot-select" disabled><option value="">—</option></select>
      <button id="add-pilot-btn" class="btn primary" style="width:auto;padding:8px 12px;" disabled>+</button>
    </div>

    <div id="pilots-list"></div>

    <button id="share-btn" class="btn" style="margin-top:12px;">🔗 Copiar enllaç de la vista</button>

    <div id="status"></div>
  </div>
</div>

<div id="time-control-container" style="display:none;">
  <div class="time-row">
    <button id="play-btn" class="btn time-btn-small primary" title="Play/Pausa">▶</button>
    <input type="range" id="time-slider" min="0" max="100" value="0" step="1"/>
    <span id="time-display">--:--:--</span>
    <select id="speed-select" class="speed-select">
      <option value="10">10x</option>
      <option value="30">30x</option>
      <option value="60" selected>60x</option>
      <option value="90">90x</option>
      <option value="120">120x</option>
    </select>
  </div>
</div>

<div id="file-banner"></div>

<script>
(function(){
  "use strict";

  const params = new URLSearchParams(window.location.search);

  // Parámetros URL para autoreproducción / configuración inicial
  const urlComp = params.get('comp');
  const urlManga = params.get('manga');
  const urlPilot = params.get('pilot');

  const COMPETITIONS = [
    {id:'A', label:'Lliga A', fsdb:'LLIGA_A.fsdb'},
    {id:'B', label:'Lliga B', fsdb:'LLIGA_B.fsdb'}
  ];
  const customFsdb = params.get('fsdb');
  if (customFsdb && !COMPETITIONS.some(c => c.fsdb === customFsdb)) {
    COMPETITIONS.unshift({id:'custom', label:'Personalitzat (' + customFsdb + ')', fsdb: customFsdb});
  }

  const PALETTE = ['#e6194b','#4363d8','#f58231','#42d4f4','#f032e6','#3cb44b',
                    '#bfef45','#fabed4','#469990','#dcbeff','#9a6324','#800000',
                    '#808000','#ffd8b1','#000075'];

  let tasksById = {};
  let rosterById = {};   
  let currentTask = null;
  let taskLayerGroup = null;
  let activePilots = {}; 
  let colorCursor = 0;

  let minEpoch = Infinity;
  let maxEpoch = -Infinity;
  let currentEpoch = 0;
  let isPlaying = false;
  let playInterval = null;

  let ssCircles = [];       // círculos de la baliza de Sortida (SSS), para cambiar color al llegar la hora
  let ssOpenEpoch = null;   // hora (epoch) de apertura de la Sortida
  let ssReached = null;     // estado actual (true/false) para no repintar en cada frame
  const SS_HIGHLIGHT_COLOR = '#ffe100';

  const map = L.map('map', {zoomControl:true}).setView([41.85, 1.2], 8);

  const BASEMAPS = {
    esri: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
    }),
    otm: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
    })
  };
  let currentBasemap = 'esri';
  BASEMAPS[currentBasemap].addTo(map);

  function setBasemap(key){
    if (key === currentBasemap || !BASEMAPS[key]) return;
    map.removeLayer(BASEMAPS[currentBasemap]);
    currentBasemap = key;
    BASEMAPS[currentBasemap].addTo(map);
  }

  const competitionSelect = document.getElementById('competition-select');
  const taskSelect = document.getElementById('task-select');
  const pilotSelect = document.getElementById('pilot-select');
  const addPilotBtn = document.getElementById('add-pilot-btn');
  const pilotsListEl = document.getElementById('pilots-list');
  const statusEl = document.getElementById('status');
  const taskInfoEl = document.getElementById('task-info');
  const legendEl = document.getElementById('legend');
  const fileBanner = document.getElementById('file-banner');
  const collapseBtn = document.getElementById('collapse-btn');
  const panel = document.getElementById('panel');
  const shareBtn = document.getElementById('share-btn');

  const timeContainer = document.getElementById('time-control-container');
  const timeSlider = document.getElementById('time-slider');
  const timeDisplay = document.getElementById('time-display');
  const playBtn = document.getElementById('play-btn');
  const speedSelect = document.getElementById('speed-select');

  collapseBtn.addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    collapseBtn.textContent = panel.classList.contains('collapsed') ? '+' : '−';
  });

  // Generar enlace compartido de la configuración activa
  shareBtn.addEventListener('click', () => {
    const url = new URL(window.location.href);
    url.searchParams.set('comp', competitionSelect.value);
    if (taskSelect.value) url.searchParams.set('manga', taskSelect.value);
    
    const activePilotIds = Object.keys(activePilots);
    if (activePilotIds.length > 0) {
      url.searchParams.set('pilot', activePilotIds.join(','));
    } else {
      url.searchParams.delete('pilot');
    }

    navigator.clipboard.writeText(url.toString()).then(() => {
      setStatus('¡Enllaç copiat al portapapers!', 'ok');
      setTimeout(() => setStatus(''), 3000);
    }).catch(() => {
      setStatus('Error al copiar l\'enllaç', 'error');
    });
  });

  function setStatus(msg, kind){
    statusEl.textContent = msg || '';
    statusEl.className = kind || '';
  }

  function normPath(p){
    return (p || '').replace(/\\/g, '/').replace(/\/+$/,'');
  }

  function fmtDuration(msDiff){
    if (!isFinite(msDiff) || msDiff < 0) return '—';
    const s = Math.round(msDiff/1000);
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
    return (h>0? h+'h ':'') + String(m).padStart(2,'0')+'m '+String(ss).padStart(2,'0')+'s';
  }

  function distMeters(lat1, lon1, lat2, lon2){
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function detectTakeoffIndex(points) {
    if (!points || points.length < 5) return 0;

    const MIN_SPEED_KMH = 12;
    const SUSTAINED_SECONDS = 12;

    for (let i = 0; i < points.length - 1; i++) {
      const p1 = points[i];
      if (!p1.epoch) continue;

      let sustainedFlight = true;
      let checkIdx = i;

      while (checkIdx < points.length - 1) {
        const pCurrent = points[checkIdx];
        const pNext = points[checkIdx + 1];
        if (!pCurrent.epoch || !pNext.epoch) break;

        const timeDiffSec = (pNext.epoch - pCurrent.epoch) / 1000;
        const totalElapsedSec = (pNext.epoch - p1.epoch) / 1000;

        if (timeDiffSec > 0) {
          const distM = distMeters(pCurrent.lat, pCurrent.lon, pNext.lat, pNext.lon);
          const speedKmh = (distM / timeDiffSec) * 3.6;

          if (speedKmh < MIN_SPEED_KMH) {
            sustainedFlight = false;
            break;
          }
        }

        if (totalElapsedSec >= SUSTAINED_SECONDS) break;
        checkIdx++;
      }

      if (sustainedFlight && checkIdx > i) {
        return i;
      }
    }

    return 0;
  }

  function taskDateFromXml(taskEl, turnpoints){
    if (turnpoints.length && turnpoints[0].open) {
      return turnpoints[0].open.substring(0,10);
    }
    const folder = taskEl.getAttribute('tracklog_folder') || '';
    const m = folder.match(/(\d{8})/);
    if (m) {
      const d = m[1];
      return d.substring(0,4)+'-'+d.substring(4,6)+'-'+d.substring(6,8);
    }
    return '';
  }

  function resetForNewCompetition(){
    if (taskLayerGroup) { map.removeLayer(taskLayerGroup); taskLayerGroup = null; }
    resetPilots();
    currentTask = null;
    tasksById = {};
    rosterById = {};
    taskSelect.innerHTML = '<option value="">Carregant fsdb…</option>';
    taskInfoEl.style.display = 'none';
    legendEl.innerHTML = '';
    pilotSelect.innerHTML = '<option value="">—</option>';
    pilotSelect.disabled = true;
    addPilotBtn.disabled = true;
    fileBanner.style.display = 'none';
  }

  function loadFsdb(url, onComplete){
    resetForNewCompetition();
    setStatus('Carregant ' + url + '…');
    fetch(url).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(text => {
      parseFsdb(text);
      setStatus('Fsdb carregat: ' + Object.keys(tasksById).length + ' mangues.', 'ok');
      if (onComplete) onComplete();
    }).catch(err => {
      setStatus('Error carregant el fsdb: ' + err.message, 'error');
      if (location.protocol === 'file:') {
        fileBanner.style.display = 'block';
        fileBanner.innerHTML = '<b>Cal servir aquesta pàgina per HTTP.</b><br/>' +
          'Obrir el fitxer directament amb doble clic (file://) bloqueja la lectura del .fsdb i dels .igc per seguretat del navegador.';
      } else {
        fileBanner.style.display = 'block';
        fileBanner.innerHTML = '<b>No s\'ha pogut carregar ' + url + '.</b><br/>' +
          'Comprova que el fitxer és al mateix directori que aquesta pàgina.';
      }
    });
  }

  function parseFsdb(xmlText){
    const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
    const perr = xml.querySelector('parsererror');
    if (perr) throw new Error('XML invàlid');

    rosterById = {};
    xml.querySelectorAll('FsCompetition > FsParticipants > FsParticipant').forEach(p => {
      rosterById[p.getAttribute('id')] = {
        name: p.getAttribute('name') || ('Pilot ' + p.getAttribute('id')),
        glider: p.getAttribute('glider') || ''
      };
    });

    tasksById = {};
    xml.querySelectorAll('FsTasks > FsTask').forEach(taskEl => {
      const id = taskEl.getAttribute('id');
      const def = taskEl.querySelector('FsTaskDefinition');
      if (!def) return;

      const turnpoints = Array.from(def.querySelectorAll('FsTurnpoint')).map(tp => ({
        id: tp.getAttribute('id'),
        lat: parseFloat(tp.getAttribute('lat')),
        lon: parseFloat(tp.getAttribute('lon')),
        radius: parseFloat(tp.getAttribute('radius')),
        altitude: tp.getAttribute('altitude'),
        open: tp.getAttribute('open'),
        close: tp.getAttribute('close')
      }));

      const shortestPath = Array.from(def.querySelectorAll('FsTaskShortestPath > FsPathVertex')).map(v => ([
        parseFloat(v.getAttribute('lat')), parseFloat(v.getAttribute('lon'))
      ]));

      const startGates = Array.from(def.querySelectorAll('FsStartGate')).map(g => g.getAttribute('open'));

      const ssRaw = def.getAttribute('ss') !== null ? parseInt(def.getAttribute('ss'), 10) : null;
      const esRaw = def.getAttribute('es') !== null ? parseInt(def.getAttribute('es'), 10) : null;
      const ss = ssRaw !== null ? ssRaw - 1 : null;
      const es = esRaw !== null ? esRaw - 1 : null;

      const participants = {};
      const partsRoot = taskEl.querySelector(':scope > FsParticipants');
      if (partsRoot) {
        Array.from(partsRoot.children).forEach(p => {
          const pid = p.getAttribute('id');
          const fd = p.querySelector('FsFlightData');
          participants[pid] = fd ? {
            distance: fd.getAttribute('distance'),
            flownSsDistance: fd.getAttribute('flown_ss_distance'),
            startedSs: fd.getAttribute('started_ss'),
            finishedSs: fd.getAttribute('finished_ss'),
            finishedTask: fd.getAttribute('finished_task'),
            lastPointTime: fd.getAttribute('last_tracklog_point_time'),
            maxAlt: fd.getAttribute('max_alt'),
            reachedGoal: fd.getAttribute('reachedGoal') === '1',
            landedBeforeDeadline: fd.getAttribute('landed_before_deadline') === '1',
            trackFile: fd.getAttribute('tracklog_filename')
          } : null;
        });
      }

      tasksById[id] = {
        id, name: taskEl.getAttribute('name') || ('T'+id),
        folder: normPath(taskEl.getAttribute('tracklog_folder')),
        goal: def.getAttribute('goal') || '',
        ss, es,
        turnpoints, shortestPath, startGates,
        participants,
        date: taskDateFromXml(taskEl, turnpoints)
      };
    });

    buildTaskSelect();
  }

  function buildTaskSelect(){
    const ids = Object.keys(tasksById).sort((a,b) => parseInt(a)-parseInt(b));
    taskSelect.innerHTML = '<option value="">Selecciona una manga…</option>';
    ids.forEach(id => {
      const t = tasksById[id];
      const flownCount = Object.values(t.participants).filter(p => p && p.trackFile).length;
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = 'T' + id + ' · ' + t.name + (t.date ? ' · ' + t.date : '') +
        ' (' + flownCount + ' tracks)';
      taskSelect.appendChild(opt);
    });
  }

  taskSelect.addEventListener('change', () => {
    const id = taskSelect.value;
    if (!id) return;
    selectTask(tasksById[id]);
  });

  const basemapSelect = document.getElementById('basemap-select');
  basemapSelect.addEventListener('change', () => setBasemap(basemapSelect.value));

  function roleOfIndex(idx, n, ss, es){
    if (idx === 0 && ss !== null && idx === ss) return 'takeoff_ss';
    if (idx === 0) return 'takeoff';
    if (ss !== null && idx === ss && es !== null && idx === es) return 'ss_ess';
    if (ss !== null && idx === ss) return 'ss';
    if (es !== null && idx === es && idx === n-1) return 'ess_goal';
    if (es !== null && idx === es) return 'ess';
    if (idx === n-1) return 'goal';
    return 'tp';
  }

  const ROLE_STYLE = {
    takeoff:    {color:'#e9f5ff', label:'Enlairament'},
    tp:         {color:'#2e9bff', label:'Baliza'},
    ss:         {color:'#00ff00', label:'Sortida (SS)'},
    ess:        {color:'#ff2d55', label:'Fi de manga (ESS)'},
    goal:       {color:'#c04dff', label:'Gol'},
    ess_goal:   {color:'#ff2db3', label:'ESS / Gol'},
    ss_ess:     {color:'#ff2d55', label:'Sortida i ESS'},
    takeoff_ss: {color:'#2e9bff', label:'Enlairament / Sortida'}
  };

  function selectTask(task, onComplete){
    currentTask = task;
    resetPilots();

    if (taskLayerGroup) { map.removeLayer(taskLayerGroup); }
    taskLayerGroup = L.layerGroup().addTo(map);

    const n = task.turnpoints.length;
    const bounds = [];
    const seenRoles = new Set();

    ssCircles = [];
    ssReached = null;
    ssOpenEpoch = task.startGates.length
      ? Math.min(...task.startGates.filter(Boolean).map(g => new Date(g).getTime()))
      : null;
    if (!isFinite(ssOpenEpoch)) ssOpenEpoch = null;

    task.turnpoints.forEach((tp, idx) => {
      const role = roleOfIndex(idx, n, task.ss, task.es);
      const style = ROLE_STYLE[role];
      const isSsRole = (role === 'ss' || role === 'ss_ess' || role === 'takeoff_ss');
      seenRoles.add(role);
      L.circle([tp.lat, tp.lon], {
        radius: tp.radius, color:'#ffffff', weight:5, opacity:0.65, fill:false
      }).addTo(taskLayerGroup);
      const circle = L.circle([tp.lat, tp.lon], {
        radius: tp.radius, color: style.color, weight: 3, fillColor: style.color, fillOpacity: 0.16
      }).addTo(taskLayerGroup);
      if (isSsRole) {
        // Si no hay FsStartGate explícito, usamos la apertura de la propia baliza SS como referencia
        if (ssOpenEpoch === null && tp.open) ssOpenEpoch = new Date(tp.open).getTime();
        ssCircles.push({ layer: circle, originalColor: style.color });
      }
      const gatesTxt = (role === 'ss' || role === 'ss_ess' || role === 'takeoff_ss') && task.startGates.length
        ? '<br/>Sortides: ' + task.startGates.map(g => g ? g.substring(11,16) : '?').join(', ')
        : '';
      circle.bindPopup(
        '<b>' + tp.id + ' · ' + style.label + '</b>' +
        'Radi: ' + Math.round(tp.radius) + ' m<br/>' +
        'Altitud: ' + tp.altitude + ' m' + gatesTxt
      );
      L.circleMarker([tp.lat, tp.lon], {radius:6, color:'#ffffff', weight:2, fillColor: style.color, fillOpacity:1})
        .addTo(taskLayerGroup)
        .bindTooltip(tp.id, {permanent:true, direction:'top', offset:[0,-8], className:'tp-label'});
      bounds.push([tp.lat, tp.lon]);
    });

    if (task.shortestPath.length > 1) {
      L.polyline(task.shortestPath, {color:'#ffffff', weight:5, opacity:0.7})
        .addTo(taskLayerGroup);
      L.polyline(task.shortestPath, {color:'#1a2340', weight:2.5, dashArray:'7,6', opacity:0.95})
        .addTo(taskLayerGroup)
        .bindPopup('Ruta òptima calculada (FsTaskShortestPath)');
    }

    if (bounds.length) map.fitBounds(bounds, {padding:[40,40]});

    legendEl.innerHTML = '';
    ['takeoff','tp','ss','ess','goal','ss_ess','ess_goal'].forEach(role => {
      if (!seenRoles.has(role)) return;
      const s = ROLE_STYLE[role];
      const span = document.createElement('span');
      span.innerHTML = '<span class="dot" style="background:'+s.color+'"></span>'+s.label;
      legendEl.appendChild(span);
    });

    const flown = Object.values(task.participants).filter(p => p && p.trackFile).length;
    taskInfoEl.style.display = 'block';
    taskInfoEl.innerHTML =
      '<b>' + task.name + '</b> · T' + task.id + (task.date ? ' · ' + task.date : '') + '<br/>' +
      task.turnpoints.length + ' balizes · ' + flown + ' tracks disponibles<br/>' +
      'Carpeta: ' + (task.folder || '—');

    buildPilotSelect(task);
    if (onComplete) onComplete();
  }

  function buildPilotSelect(task){
    const entries = Object.entries(task.participants)
      .filter(([id, fd]) => fd && fd.trackFile)
      .map(([id, fd]) => ({id, fd, name: (rosterById[id] || {}).name || ('Pilot ' + id)}))
      .sort((a,b) => a.name.localeCompare(b.name));

    pilotSelect.innerHTML = '';
    if (!entries.length) {
      pilotSelect.innerHTML = '<option value="">Cap track disponible</option>';
      pilotSelect.disabled = true;
      addPilotBtn.disabled = true;
      return;
    }
    pilotSelect.innerHTML = '<option value="">Selecciona un pilot…</option>' +
      entries.map(e => '<option value="'+e.id+'">'+e.name+'</option>').join('');
    pilotSelect.disabled = false;
    addPilotBtn.disabled = false;
  }

  addPilotBtn.addEventListener('click', () => {
    const id = pilotSelect.value;
    if (!id || !currentTask) return;
    addPilotTrack(id);
  });

  function resetPilots(){
    stopTime();
    Object.values(activePilots).forEach(p => { 
      if (p.layerGroup) map.removeLayer(p.layerGroup); 
      if (p.marker) map.removeLayer(p.marker);
    });
    activePilots = {};
    colorCursor = 0;
    minEpoch = Infinity;
    maxEpoch = -Infinity;
    timeContainer.style.display = 'none';
    renderPilotsList();
  }

  function nextColor(){
    const c = PALETTE[colorCursor % PALETTE.length];
    colorCursor++;
    return c;
  }

  function addPilotTrack(pilotId){
    if (activePilots[pilotId]) return;
    const task = currentTask;
    
    // Si pilotId no es un ID directo, buscar por nombre
    let resolvedId = pilotId;
    if (!task.participants[resolvedId]) {
      const match = Object.entries(rosterById).find(([id, r]) => r.name.toLowerCase() === pilotId.toLowerCase());
      if (match) resolvedId = match[0];
    }

    const fd = task.participants[resolvedId];
    const name = (rosterById[resolvedId] || {}).name || ('Pilot ' + resolvedId);
    if (!fd || !fd.trackFile) return;

    // Nombre de fichero tal cual figura en el FSDB (tracklog_filename), sin inventar variantes
    const trackFileName = fd.trackFile.trim();
    const trackUrl = task.folder + '/' + trackFileName;

    setStatus('Carregant track de ' + name + '…');

    const color = nextColor();
    activePilots[resolvedId] = {layerGroup:null, marker:null, color, name, loading:true};
    renderPilotsList();

    fetch(trackUrl)
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(igcText => {
      let points = parseIgc(igcText);
      if (!points.length) throw new Error('sense punts B vàlids');

      const takeoffIdx = detectTakeoffIndex(points);
      if (takeoffIdx > 0) {
        const takeoffEpoch = points[takeoffIdx].epoch;
        if (takeoffEpoch) {
          const marginMs = 2 * 60 * 1000;
          const trimmedStart = points.filter(p => p.epoch === null || p.epoch >= (takeoffEpoch - marginMs));
          if (trimmedStart.length) points = trimmedStart;
        } else {
          points = points.slice(Math.max(0, takeoffIdx - 10));
        }
      }

      if (fd.lastPointTime) {
        const landingEpoch = new Date(fd.lastPointTime).getTime();
        if (!isNaN(landingEpoch)) {
          const trimmedEnd = points.filter(p => p.epoch === null || p.epoch <= landingEpoch + 1 * 60 * 1000);
          if (trimmedEnd.length) points = trimmedEnd;
        }
      }

      const layerGroup = L.layerGroup().addTo(map);
      const latlngs = points.map(p => [p.lat, p.lon]);
      L.polyline(latlngs, {color, weight: 3, opacity: 0.85}).addTo(layerGroup);

      const start = points[0], end = points[points.length-1];
      L.circleMarker([start.lat, start.lon], {radius:5, color:'#2e7d32', fillColor:'#2e7d32', fillOpacity:1})
        .addTo(layerGroup).bindPopup('<b>'+name+'</b>Enlairament ' + (start.time||''));

      const landingLabel = fd.reachedGoal
        ? (fd.startedSs && fd.finishedSs 
            ? fmtDuration(new Date(fd.finishedSs) - new Date(fd.startedSs)) 
            : (fd.lastPointTime ? new Date(fd.lastPointTime).toLocaleTimeString('es-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : 'Gol'))
        : (fd.distance ? fd.distance + ' km' : '—');
      const landingClass = fd.reachedGoal ? 'landing-label goal' : 'landing-label nogoal';
      L.circleMarker([end.lat, end.lon], {radius:5, color:'#d9534a', fillColor:'#d9534a', fillOpacity:1})
        .addTo(layerGroup)
        .bindPopup(buildPilotPopup(name, fd))
        .bindTooltip(landingLabel, {permanent:true, direction:'right', offset:[6,0], className:landingClass});

      if (currentTask) {
        currentTask.turnpoints.forEach(tp => {
          const hit = points.find(p => distMeters(p.lat, p.lon, tp.lat, tp.lon) <= tp.radius);
          if (hit) {
            L.circleMarker([hit.lat, hit.lon], {
              radius:4, weight:2, color:'#ffffff', fillColor:color, fillOpacity:1, className:'crossing-marker'
            }).addTo(layerGroup).bindPopup('<b>'+name+'</b>Pas per ' + tp.id + (hit.time ? ' · ' + hit.time : ''));
          }
        });
      }

      const initialLetter = name.trim().charAt(0).toUpperCase();
      const customIcon = L.divIcon({
        className: '',
        html: `<div class="pilot-live-marker" style="background-color: ${color}; width:20px; height:20px;">${initialLetter}</div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });

      const liveMarker = L.marker([start.lat, start.lon], {icon: customIcon, zIndexOffset: 1000});
      liveMarker.bindPopup(`<b>${name}</b><div id="pop-${resolvedId}"></div>`);

      activePilots[resolvedId] = {layerGroup, marker: liveMarker, color, name, latlngs, points, fd};
      
      recalcTimeBounds();
      renderPilotsList();
      setStatus('Track de ' + name + ' carregat.', 'ok');
      map.fitBounds(latlngs, {padding:[40,40]});
    }).catch(err => {
      delete activePilots[resolvedId];
      renderPilotsList();
      setStatus('No s\'ha pogut carregar el track de ' + name + ': ' + err.message + ' — URL intentada: ' + trackUrl, 'error');
    });
  }

  function buildPilotPopup(name, fd){
    let ssTime = '—';
    if (fd.startedSs && fd.finishedSs) {
      ssTime = fmtDuration(new Date(fd.finishedSs) - new Date(fd.startedSs));
    }
    return '<b>' + name + '</b>' +
      'Distància: ' + (fd.distance || '—') + ' km<br/>' +
      'Temps de mànega: ' + ssTime + '<br/>' +
      'Gol: ' + (fd.reachedGoal ? 'Sí' : 'No') + '<br/>' +
      'Alt. màx.: ' + (fd.maxAlt || '—') + ' m';
  }

  function removePilotTrack(pilotId){
    const p = activePilots[pilotId];
    if (!p) return;
    if (p.layerGroup) map.removeLayer(p.layerGroup);
    if (p.marker) map.removeLayer(p.marker);
    delete activePilots[pilotId];
    recalcTimeBounds();
    renderPilotsList();
  }

  function renderPilotsList(){
    pilotsListEl.innerHTML = '';
    Object.entries(activePilots).forEach(([id, p]) => {
      const div = document.createElement('div');
      div.className = 'pilot-item';
      div.style.borderLeftColor = p.color;
      const stats = p.loading ? 'carregant…' :
        (p.fd ? (p.fd.distance||'—') + ' km · ' + (p.fd.reachedGoal ? 'Gol' : 'No Gol') : '');
      div.innerHTML =
        '<span class="pilot-swatch" style="background:'+p.color+'"></span>' +
        '<span class="pilot-main"><span class="pilot-name">'+p.name+'</span>' +
        '<div class="pilot-stats">'+stats+'</div></span>' +
        '<button class="pilot-remove" title="Treure">×</button>';
      div.querySelector('.pilot-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removePilotTrack(id);
      });
      div.addEventListener('click', () => {
        if (p.latlngs) map.fitBounds(p.latlngs, {padding:[40,40]});
      });
      pilotsListEl.appendChild(div);
    });
  }

  function recalcTimeBounds(){
    minEpoch = Infinity;
    maxEpoch = -Infinity;
    let hasValidPoints = false;

    Object.values(activePilots).forEach(p => {
      if (p.points && p.points.length) {
        p.points.forEach(pt => {
          if (pt.epoch) {
            if (pt.epoch < minEpoch) minEpoch = pt.epoch;
            if (pt.epoch > maxEpoch) maxEpoch = pt.epoch;
            hasValidPoints = true;
          }
        });
      }
    });

    if (hasValidPoints && minEpoch < maxEpoch) {
      timeContainer.style.display = 'block';
      timeSlider.min = minEpoch;
      timeSlider.max = maxEpoch;
      if (!currentEpoch || currentEpoch < minEpoch || currentEpoch > maxEpoch) {
        currentEpoch = minEpoch;
      }
      timeSlider.value = currentEpoch;
      updateTimePosition(currentEpoch);
    } else {
      timeContainer.style.display = 'none';
      stopTime();
    }
  }

  function interpolatePosition(points, targetEpoch) {
    if (!points || !points.length) return null;
    if (targetEpoch <= points[0].epoch) return points[0];
    if (targetEpoch >= points[points.length - 1].epoch) return points[points.length - 1];

    for (let i = 0; i < points.length - 1; i++) {
      const p1 = points[i];
      const p2 = points[i + 1];
      if (p1.epoch <= targetEpoch && p2.epoch >= targetEpoch) {
        const factor = (targetEpoch - p1.epoch) / (p2.epoch - p1.epoch);
        const lat = p1.lat + (p2.lat - p1.lat) * factor;
        const lon = p1.lon + (p2.lon - p1.lon) * factor;
        const alt = p1.alt !== null && p2.alt !== null ? Math.round(p1.alt + (p2.alt - p1.alt) * factor) : p1.alt;
        return { lat, lon, alt, epoch: targetEpoch };
      }
    }
    return null;
  }

  function updateTimePosition(epoch) {
    currentEpoch = epoch;

    if (ssOpenEpoch !== null && ssCircles.length) {
      const reached = epoch >= ssOpenEpoch;
      if (reached !== ssReached) {
        ssReached = reached;
        ssCircles.forEach(({layer, originalColor}) => {
          const color = reached ? SS_HIGHLIGHT_COLOR : originalColor;
          layer.setStyle({ color, fillColor: color, fillOpacity: reached ? 0.35 : 0.16 });
        });
      }
    }

    const d = new Date(epoch);
    timeDisplay.textContent = d.toLocaleTimeString('es-ES', { 
      timeZone: 'Europe/Madrid', 
      hour: '2-digit', 
      minute: '2-digit', 
      second: '2-digit', 
      hour12: false 
    });

    Object.entries(activePilots).forEach(([id, p]) => {
      if (!p.points) return;
      const pos = interpolatePosition(p.points, epoch);
      const firstPt = p.points[0];
      const lastPt = p.points[p.points.length - 1];

      if (pos && epoch >= firstPt.epoch && epoch <= lastPt.epoch) {
        if (!map.hasLayer(p.marker)) p.marker.addTo(map);
        p.marker.setLatLng([pos.lat, pos.lon]);
        
        const popEl = document.getElementById('pop-' + id);
        if (popEl) {
          popEl.innerHTML = `Altitud: ${pos.alt !== null ? pos.alt + ' m' : '—'}`;
        }
      } else {
        if (map.hasLayer(p.marker)) map.removeLayer(p.marker);
      }
    });
  }

  function startTime() {
    if (isPlaying) return;
    isPlaying = true;
    playBtn.textContent = '⏸';
    const intervalMs = 100;
    playInterval = setInterval(() => {
      const speed = parseFloat(speedSelect.value) || 10;
      let nextEpoch = currentEpoch + (intervalMs * speed);
      if (nextEpoch >= maxEpoch) {
        nextEpoch = maxEpoch;
        stopTime();
      }
      timeSlider.value = nextEpoch;
      updateTimePosition(nextEpoch);
    }, intervalMs);
  }

  function stopTime() {
    isPlaying = false;
    playBtn.textContent = '▶';
    if (playInterval) {
      clearInterval(playInterval);
      playInterval = null;
    }
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) stopTime();
    else {
      if (currentEpoch >= maxEpoch) {
        currentEpoch = minEpoch;
        timeSlider.value = currentEpoch;
      }
      startTime();
    }
  });

  timeSlider.addEventListener('input', () => {
    updateTimePosition(parseFloat(timeSlider.value));
  });

  function parseIgc(text){
    const lines = text.split(/\r?\n/);
    let dateSeconds = null;
    const points = [];
    for (const line of lines) {
      if (line.length >= 11 && line.startsWith('HFDTE')) {
        if (line.startsWith('HFDTEDATE:')) {
          dateSeconds = Date.UTC(+('20'+line.substring(14,16)), +line.substring(12,14)-1, +line.substring(10,12));
        } else {
          dateSeconds = Date.UTC(+('20'+line.substring(9,11)), +line.substring(7,9)-1, +line.substring(5,7));
        }
        continue;
      }
      if (line.length > 30 && line.charAt(0) === 'B') {
        const hh = +line.substring(1,3), mm = +line.substring(3,5), ss = +line.substring(5,7);
        const la1 = +line.substring(7,9), la2 = +line.substring(9,14);
        const lat = line.charAt(14) === 'N' ? la1 + la2/60000 : -(la1 + la2/60000);
        const lo1 = +line.substring(15,18), lo2 = +line.substring(18,23);
        const lon = line.charAt(23) === 'E' ? lo1 + lo2/60000 : -(lo1 + lo2/60000);
        if (isNaN(lat) || isNaN(lon)) continue;
        let alt = null;
        if (line.length >= 35) {
          const gnssAlt = parseInt(line.substring(30,35), 10);
          alt = isNaN(gnssAlt) ? null : gnssAlt;
        }
        let timeStr = '';
        let epoch = null;
        if (dateSeconds !== null) {
          epoch = dateSeconds + (hh*3600+mm*60+ss)*1000;
          const t = new Date(epoch);
          timeStr = t.toLocaleTimeString('es-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }
        points.push({lat, lon, alt, time: timeStr, epoch});
      }
    }
    return points;
  }

  function buildCompetitionSelect(){
    competitionSelect.innerHTML = COMPETITIONS.map(c => '<option value="'+c.id+'">'+c.label+'</option>').join('');
    let initial = COMPETITIONS[0];
    
    // Si viene por URL la competición, seleccionarla
    if (urlComp) {
      const matchComp = COMPETITIONS.find(c => c.id.toLowerCase() === urlComp.toLowerCase());
      if (matchComp) initial = matchComp;
    } else if (customFsdb) {
      const match = COMPETITIONS.find(c => c.fsdb === customFsdb);
      if (match) initial = match;
    }
    competitionSelect.value = initial.id;
  }

  competitionSelect.addEventListener('change', () => {
    const comp = COMPETITIONS.find(c => c.id === competitionSelect.value);
    if (comp) loadFsdb(comp.fsdb);
  });

  // Carga inicial y lectura de parámetros URL
  buildCompetitionSelect();
  const initialComp = COMPETITIONS.find(c => c.id === competitionSelect.value);
  loadFsdb(initialComp.fsdb, () => {
    if (urlManga && tasksById[urlManga]) {
      taskSelect.value = urlManga;
      selectTask(tasksById[urlManga], () => {
        if (urlPilot) {
          const pilots = urlPilot.split(',');
          pilots.forEach(pId => addPilotTrack(pId.trim()));
        }
      });
    }
  });
})();
</script>
